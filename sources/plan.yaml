# Input to `python -m datalab register`: the files we intend to use and where
# they are officially published. `sources/manifest.csv` and
# `sources/verification/*.json` are the OUTPUT of registering these.
#
# Every file_url below was either read from the official landing page tonight
# or taken from the ra-ship registry; none is guessed. `archive_path` is
# relative to RA_SHIP_DIR and is used only to compare hashes (and as a last
# resort copy, recorded as such).

defaults:
  abs:
    doc_type: abs
    publisher: "Finance Division, Government of Pakistan"
    jurisdiction: federal
    language: en
    markers_all: ["annual budget statement"]
    markers_any: ["government of pakistan", "finance division"]
    marker_period: true          # the fiscal year must appear in the first pages
    # Fallback for editions whose cover page has no text layer (2010-11, 2017-18): the contents
    # page markers, accepted only together with a verified link from the official landing page.
    alt_markers_all: ["contents", "receipts", "federal consolidated fund"]

  cpi:
    doc_type: cpi_monthly_review
    publisher: "Pakistan Bureau of Statistics"
    jurisdiction: pbs
    language: en
    markers_all: []
    markers_any: ["monthly review", "price indices", "consumer price index"]
    marker_pages: 4
  lfs:
    doc_type: lfs_annual_report
    publisher: "Pakistan Bureau of Statistics"
    jurisdiction: pbs
    language: en
    markers_all: ["labour force survey"]
    markers_any: []
    # The PBS link labelled "LFS 2014-15" serves the Azad Jammu & Kashmir edition, not the national report.
    markers_none: ["azad jammu"]
    marker_period: true
    marker_pages: 4

  # Pakistan Economic Survey chapters, used only to cross-check figures we already hold.
  pes:
    doc_type: pes_chapter
    publisher: "Finance Division, Government of Pakistan"
    jurisdiction: federal
    language: en
    markers_all: ["pakistan economic survey"]
    markers_any: []
    marker_period: true
    marker_pages: 3

