  # Added 2026-10-12 (C6). SBP EasyData, used ONLY to cross-check a figure we already hold; never a
  # source of a published value. The file was downloaded on 2026-10-10 by the first run's sources track
  # from the public "Download Series" form of the series page (no login, no API key), and its request was
  # recorded next to it at download time; it had not been registered. The EasyData API
  # (https://easydata.sbp.org.pk/api/v1/series) answers 401 without a key: not used, not worked around.
  - source_id: sbp-easydata-cpi-national-yoy
    family: sbp
    doc_type: sbp_easydata
    publisher: "State Bank of Pakistan"
    jurisdiction: sbp
    language: en
    period: "2026-10-10"         # the day of the download (the series itself runs monthly, see the record)
    role: cross_source
    title: "SBP EasyData: National CPI, year-on-year change (series TS_GP_PT_CPI_M.P00011516)"
    landing_url: https://easydata.sbp.org.pk
    file_url: https://easydata.sbp.org.pk/apex/wwv_flow.accept
    filename: data_series.csv
    reproducible_by_url: false
    csv_columns_all: ["Dataset", "Series Key", "Series", "Observation Date", "Observation Value", "Unit"]
    # The series definition is taken from the file's own descriptive columns, in every row.
    csv_column_patterns:
      "Dataset": '^Inflation Snapshot \(New Base: 2015-16\)$'
      "Series Key": '^TS_GP_PT_CPI_M\.P00011516$'
      "Series": '(?i)^cpi national\s*-?\s*yoy$'
      "Unit": '^Percent$'
    terms_note: >-
      The EasyData pages carry "Copyright (c) 2026, All Rights Reserved. State Bank of Pakistan" and link a
      Disclaimer page; no open-data licence is stated on the pages that were saved. The file is used only to
      compare with PBS figures (the SBP figure appears in a check record, not as a published series). A human
      must read the Disclaimer and confirm that this use, and showing the SBP figure on a receipt, is allowed.
    credentials_note: >-
      Downloaded without an account from the public series page. The documented API needs an API key
      (HTTP 401 without one). If the project wants a repeatable API pull, a human must register for a key
      and put it in .env; nothing was done to get around that.
    notes: >-
      Cross-check only. Downloaded by submitting the public "Download Series" form (a POST bound to a browser
      session), so it cannot be re-downloaded by URL and a later download would also hold later months.
      Reuse terms not confirmed (see the verification record).
