        series_page_url: "https://easydata.sbp.org.pk/apex/f?p=10:120:3993964339093::NO:RP:P120_SERIES_KEY,P120_ACTION,P120_PAGE_ID:TS_GP_PT_CPI_M.P00011516,New,100&cs=19B1F6AB22546BD04D5FCE70779BA769A"
