name: CI

on:
  push:
    branches: [main, "proto/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline tests and release self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-ci.lock
      # requirements-ci.lock is the full lock minus Docling and its model stack (several GB).
      # Extraction itself is not run in CI: it needs the source PDFs, which are never in git.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/requirements-ci.lock
          python -m pip install -e pipeline --no-deps
      - name: Tests
        working-directory: pipeline
        run: python -m pytest
      - name: Release self-check (re-runs the checks over the release's own cells; no PDFs needed)
        run: |
          for d in releases/*/; do
            python -m datalab check-release "${d%/}"
          done
      - name: No source documents, secrets or absolute paths in the repo
        run: |
          if git ls-files | grep -iE '\.(pdf|xls|xlsx|zip)$|(^|/)\.env$'; then
            echo "Source documents or .env files are committed"; exit 1
          fi
          if git grep -nE 'C:[\\/]+Users[\\/]' -- pipeline specs sources schema releases site/src ':!sources/verification' ; then
            echo "Absolute Windows paths found"; exit 1
          fi

  site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has_site
        run: echo "present=$([ -f site/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has_site.outputs.present == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install, lint, build
        if: steps.has_site.outputs.present == 'true'
        working-directory: site
        run: |
          npm ci
          npm run lint
          npm run build
